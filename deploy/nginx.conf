# nginx site config for play-next-api-workspace-web.
#
# This is a *server* block, not a full nginx.conf. Install it as one nginx
# site (see README.md, "Deploying to a VM") and reload nginx.
#
# It does two things:
#   1. Serves the built `dist/` directory as static files, with SPA
#      fallback so client-side routes and browser refreshes on a deep
#      link don't 404.
#   2. Reverse-proxies `/api` to the API process (run separately under
#      PM2, unchanged by this file) so the browser sees a single origin.
#      This is what lets VITE_API_BASE_URL be a same-origin relative path
#      like `/api` instead of an absolute `http://host:port` - see
#      README.md for why that matters and what it does to CORS.
#
# Nothing here hardcodes a hostname or a specific machine's filesystem
# path. Replace the two placeholders below for your deployment:
#   __DIST_PATH__   - absolute path to this app's built `dist/` directory
#                     on the VM, e.g. /opt/play-next-api-workspace-web/dist
#   __API_ORIGIN__  - where the PM2-managed API actually listens, e.g.
#                     http://127.0.0.1:3000 (loopback only, since nginx is
#                     the only thing that needs to reach it directly)

server {
    listen 80;
    server_name _;

    root __DIST_PATH__;
    index index.html;

    # Static assets and the SPA shell. try_files falls back to index.html
    # for any path that isn't a real file on disk, which is required for
    # client-side routing: without it, a deep link or a browser refresh
    # on any path other than "/" 404s, because there is no matching file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy `/api` to the API. The trailing slash on both the
    # location and proxy_pass matters: it strips the `/api/` prefix
    # before forwarding, so `/api/api/v1/collections` (what this app's
    # axios client requests when VITE_API_BASE_URL=/api, since it already
    # appends `/api/v1` itself) reaches the API's real route at
    # `/api/v1/collections`, and `/api/health` reaches the API's real
    # `/health` route.
    location /api/ {
        proxy_pass __API_ORIGIN__/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE correctness. Do not remove any of these. ---
        #
        # nginx buffers proxied responses by default, which silently
        # breaks Server-Sent Events: events sit in nginx's buffer
        # instead of streaming to the browser as they happen, so the
        # app's live-update notice stops working with no error anywhere.
        #
        # proxy_buffering off is what actually fixes that - it makes
        # nginx forward each chunk from the API to the client as soon as
        # it arrives, instead of waiting to fill a buffer or see the
        # response end.
        proxy_buffering off;
        proxy_cache off;

        # Also tell any upstream proxy/CDN layered in front of this one
        # not to buffer the response, in case one is added later.
        proxy_set_header X-Accel-Buffering no;

        # The default proxy_read_timeout (60s) will silently kill an
        # idle SSE connection that has nothing to send for a minute -
        # the API's heartbeats are more frequent than that today, but a
        # generous timeout avoids this becoming a surprise if that ever
        # changes. This does not keep genuinely dead connections open
        # forever; the client's own reconnect logic (Last-Event-ID)
        # handles a real drop.
        proxy_read_timeout 1h;

        # Explicitly keep the connection alive rather than closing it
        # after each response, which HTTP/1.1 already implies but which
        # is worth stating given how easy it is to break SSE by copying
        # in a `Connection: close` from an unrelated example config.
        proxy_set_header Connection "";
    }
}
